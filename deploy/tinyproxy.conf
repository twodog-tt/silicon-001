# 香港机正向 HTTP 代理（只绑 127.0.0.1，不对外开放）
# 在你自己的海外机上：sudo bash deploy/hk-tinyproxy.sh

User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
BindSame yes
Timeout 60
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 50
Allow 127.0.0.1
Allow ::1
ConnectPort 443
ConnectPort 80
ViaProxyName "tinyproxy"
